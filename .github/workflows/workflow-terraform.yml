name: "- Terraform Workflow"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
        description: 'Action to perform: plan or apply'

jobs:
  terraform:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'apply' && inputs.environment || '' }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment input
        run: |
          if [[ "${{ inputs.environment }}" != "dev" && "${{ inputs.environment }}" != "prd" ]]; then
            echo "Error: environment must be either 'dev' or 'prd'"
            exit 1
          fi

      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Check if S3 backend bucket exists
        id: check_backend
        run: |
          if aws s3 ls s3://us-cicd --region eu-central-1 2>/dev/null; then
            echo "backend_exists=true" >> $GITHUB_OUTPUT
            echo "✅ S3 backend bucket 'us-cicd' exists"
          else
            echo "backend_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  S3 backend bucket 'us-cicd' does not exist"
            echo "This is expected for new deployments. Please create the bucket manually or deploy for the first time."
          fi

      - name: Create placeholders for deployment packages
        if: inputs.action == 'plan' && steps.check_backend.outputs.backend_exists == 'true'
        run: |
          mkdir -p ../dist
          for dir in $(find ../src -maxdepth 1 -mindepth 1 -type d); do
            touch ../dist/$(basename $dir).zip
          done

      - name: Download deployment packages
        if: inputs.action == 'apply' && steps.check_backend.outputs.backend_exists == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          name: deployment-packages

      - name: List deployment packages
        if: steps.check_backend.outputs.backend_exists == 'true'
        run: ls -l ../dist

      - name: Terraform init
        if: steps.check_backend.outputs.backend_exists == 'true'
        run: terraform init

      - name: Terraform select '${{ inputs.environment }}' workspace
        if: steps.check_backend.outputs.backend_exists == 'true'
        run: terraform workspace select ${{ inputs.environment }} || terraform workspace new ${{ inputs.environment }}

      - name: Terraform plan
        if: inputs.action == 'plan' && steps.check_backend.outputs.backend_exists == 'true'
        run: terraform plan

      - name: Terraform apply
        if: inputs.action == 'apply' && steps.check_backend.outputs.backend_exists == 'true'
        run: terraform apply -auto-approve

      - name: Skip Terraform operations
        if: steps.check_backend.outputs.backend_exists == 'false'
        run: |
          echo "🚫 Skipping Terraform ${{ inputs.action }} for ${{ inputs.environment }} environment"
          echo "Reason: S3 backend bucket 'us-cicd' does not exist"
          echo ""
          echo "To deploy this project for the first time:"
          echo "1. Create the S3 bucket 'us-cicd' in eu-central-1 region"
          echo "2. Run the pipeline again or deploy manually"
          echo ""
          echo "This is expected behavior for new projects."
